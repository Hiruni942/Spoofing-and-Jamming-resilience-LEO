[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-leo-resilience"
version = "0.1.0"
description = "GNSS and LEO satellite simulation for spoofing/jamming resilience"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "GNSS LEO Research Team"},
]
keywords = ["GNSS", "LEO", "satellite", "spoofing", "jamming", "PNT", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.10",
    "flake8>=4.0",
    "mypy>=0.960",
]
docs = [
    "sphinx>=4.5",
    "sphinx-rtd-theme>=1.0",
]
jupyter = [
    "jupyter>=1.0",
    "jupyterlab>=3.0",
    "notebook>=6.4",
]

[project.urls]
"Homepage" = "https://github.com/Hiruni942/Spoofing-and-Jamming-resilience-LEO"
"Bug Tracker" = "https://github.com/Hiruni942/Spoofing-and-Jamming-resilience-LEO/issues"
"Documentation" = "https://github.com/Hiruni942/Spoofing-and-Jamming-resilience-LEO"

[tool.setuptools]
packages = ["gnss_leo"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=gnss_leo --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
